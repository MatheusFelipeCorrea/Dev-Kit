# Hyperion jobs for GitLab CI — include from .gitlab-ci.yml:
#
#   include:
#     - local: .gitlab/hyperion-ci.yml
#
# Requires Node 20+ and Hyperion scripts at repo root.
# Does not replace your product pipeline stages.

stages:
  - hyperion

.hyperion_node:
  image: node:22
  before_script:
    - node -v

hyperion-validate:
  extends: .hyperion_node
  stage: hyperion
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run docs:check
    - npm run skills:validate
    - npm run hyperion:check-rules
    - npm run hyperion:skills-eval
    - npm test
  allow_failure: false

hyperion-cards:
  extends: .hyperion_node
  stage: hyperion
  rules:
    - changes:
        - .github/cards/**/*
  script:
    - node scripts/cards-sync/validate.mjs
    - node scripts/cards-sync/sync.mjs --dry-run

hyperion-security:
  extends: .hyperion_node
  stage: hyperion
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      if [ -f package.json ]; then
        npm audit --audit-level=high
      fi
    - |
      if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
        pip install pip-audit
        pip-audit || pip-audit -r requirements.txt
      fi
  allow_failure: false
