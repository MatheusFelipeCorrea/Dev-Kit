name: Docs / onboarding
description: Typos, unclear guides, missing links, adoption friction
title: "[docs] "
labels: ["documentation", "good first issue", "triage"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: File or URL (README, GETTING-STARTED, docs path, …)
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What’s wrong or unclear?
      description: Quote the confusing bit if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional rewrite or structure idea.
  - type: checkboxes
    id: first
    attributes:
      label: Good first issue?
      options:
        - label: This looks suitable for a first-time contributor
          required: false
