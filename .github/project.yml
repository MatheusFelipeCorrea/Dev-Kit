# yaml-language-server: $schema=./project.schema.json
# Project contract for Dev-Kit agents and skills.
# Copy from project.example.yml and adapt to your product.

version: 1

name: My Project
locale: en

layout: single

apps:
  api:
    root: src
    manifest: package.json
    source_dirs:
      - src

docs:
  requirements: null
  blueprints: .github/docs
  diagrams: null

outputs:
  audits: .github/audits/results
  cards: .github/plans/cards
  implementations: .github/plans/implementations
  diagrams: .github/diagrams

stack_hints: []

conventions:
  requirement_prefixes:
    - REQ
    - BIZ
  finding_prefixes:
    product-owner: PO
    application-security: SEC
    devops: OPS
    code-review: DEV
    ux-design: UX
    architecture: ARCH

management:
  backend: github

audits:
  overlay: null
