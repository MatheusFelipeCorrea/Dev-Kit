# Mapa de auditorias — fonte única para skills, prompts, scanners e pastas de saída.
# Atualize aqui ao adicionar novo tipo de auditoria.
#
# Portabilidade: este manifesto é genérico (kit reutilizável). Paths de produto,
# docs e stack ficam em `project_config`; contexto de domínio no `overlay`.
# Em outro repositório, mantenha este arquivo e ajuste só project.yml + overlay.

version: 1

project_config: .github/project.yml

# Overlay opcional é resolvido por `audits.overlay` em project.yml.
# O manifesto base não conhece produto, domínio ou stack.

defaults:
  results_root: .github/audits/results
  prompts_root: .github/audits/prompts

audits:
  product-owner:
    label: Product Owner
    skill: po-audit
    prompt: prompts/product-owner.md
    output_dir: results/product-owner
    id_prefix: PO
    phased: false
    scanners: []

  application-security:
    label: Application Security
    skill: security-audit
    prompt: prompts/security.md
    output_dir: results/application-security
    id_prefix: SEC
    phased: true
    phases: [1, 2, 3, consolidate]
    scanners:
      - id: npm-audit
        workflow: .github/workflows/hyperion-security.yml
        jobs: [audit]
        schedule: "weekly (Mon 09:00 UTC)"

  devops:
    label: DevOps / SRE
    skill: devops-audit
    prompt: prompts/devops.md
    output_dir: results/devops
    id_prefix: OPS
    phased: true
    phases: [1, 2, 3, consolidate]
    scanners:
      - id: ci
        workflow: .github/workflows/hyperion-validate.yml
        jobs: [lint-test-build]
      - id: dependabot
        config: .github/dependabot.yml
        note: "Ativo para GitHub Actions; ecossistemas de app podem ser habilitados no arquivo."

  code-review:
    label: Code Review (Dev Senior)
    skill: code-review
    prompt: prompts/code-review.md
    output_dir: results/code-review
    id_prefix: DEV
    phased: true
    phases: [1, 2, 3, consolidate]
    scanners:
      - id: ci-tests
        workflow: .github/workflows/hyperion-validate.yml
        note: Cobertura e testes — achados qualitativos ficam no relatório do agente

  ux-design:
    label: UX / Design System
    skill: ux-audit
    prompt: prompts/ux-design.md
    output_dir: results/ux-design
    id_prefix: UX
    phased: true
    phases: [1, 2, 3, canonical]
    scanners: []

  architecture:
    label: Architecture
    skill: architecture-audit
    prompt: prompts/architecture.md
    output_dir: results/architecture
    id_prefix: ARCH
    phased: true
    phases: [1, 2, 3, consolidate]
    scanners: []
